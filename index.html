<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Theme before first paint: dark by default, the visitor's saved choice wins. No flash. -->
    <script>
      (function () {
        var r = document.documentElement, t = 'dark', l = 'nl'
        var ok = function (v) { return v === 'nl' || v === 'en' || v === 'es' }
        try { var s = localStorage.getItem('circa-theme'); if (s === 'light' || s === 'dark') t = s } catch (e) {}
        try {
          var q = new URLSearchParams(location.search).get('lang')
          var sl = null; try { sl = localStorage.getItem('circa-lang') } catch (e) {}
          var n = (navigator.language || '').slice(0, 2).toLowerCase()
          l = ok(q) ? q : ok(sl) ? sl : ok(n) ? n : 'nl'
        } catch (e) {}
        r.dataset.theme = t
        r.style.colorScheme = t
        r.lang = l
      })()
    </script>
    <title>Circa — Schat. Daag uit. Win.</title>
